<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#4285F4" stroke="#3367D6" stroke-width="2"/>
  
  <!-- Drive triangle icon (simplified Google Drive logo) -->
  <polygon points="64,20 104,90 24,90" fill="#ffffff" opacity="0.9"/>
  
  <!-- Sync arrows -->
  <g transform="translate(64,64)" fill="none" stroke="#1a73e8" stroke-width="3.5" stroke-linecap="round">
    <!-- Arrow from cloud to folder -->
    <polyline points="-18,-8 -26,-8 -26,4 -18,4" stroke="#34a853" fill="#34a853"/>
    <polyline points="-22,-12 -26,-8 -22,-4" stroke="#34a853" fill="none"/>
    
    <!-- Arrow from folder to cloud -->
    <polyline points="18,8 26,8 26,-4 18,-4" stroke="#fbbc04" fill="#fbbc04"/>
    <polyline points="22,12 26,8 22,4" stroke="#fbbc04" fill="none"/>
  </g>
  
  <!-- Inner white circle -->
  <circle cx="64" cy="64" r="55" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
</svg>
