name: Build and Release

on:
  push:
    branches:
      - "main"
      - "master"
  workflow_dispatch:
    inputs:
      increment:
        description: "Version increment type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - name: Configure Git
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine increment type
        id: increment
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "type=${{ github.event.inputs.increment }}" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Create version tag
        id: tag
        shell: bash
        run: |
          git fetch --tags
          COMMIT_SHA=$(git rev-parse HEAD)

          # Get the latest tag across all branches
          PREVIOUS_TAG=$(git tag --sort=-version:refname | head -1)

          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG="0.0.0"
          fi

          # Strip leading 'v' if present
          PREVIOUS_TAG="${PREVIOUS_TAG#v}"

          echo "Previous tag: $PREVIOUS_TAG"
          TAG=$(node .github/scripts/generate-version.js "$PREVIOUS_TAG" "${{ steps.increment.outputs.type }}")

          echo "Tagging commit $COMMIT_SHA with v$TAG"
          git tag "v$TAG" $COMMIT_SHA
          git push origin "v$TAG"

          echo "tag=v$TAG" >> $GITHUB_OUTPUT
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "notes=Initial release of gdrive-linux" >> $GITHUB_OUTPUT
          else
            NOTES=$(git log --oneline --no-decorate "$PREVIOUS_TAG..HEAD" 2>/dev/null || echo "No changes since last release")
            NOTES="${NOTES//'%'/'%25'}"
            NOTES="${NOTES//$'\n'/'%0A'}"
            NOTES="${NOTES//$'\r'/'%0D'}"
            echo "notes=$NOTES" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release (draft)
        shell: bash
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "${{ steps.notes.outputs.notes }}" \
            --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    needs: [create-release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check .

  build-ubuntu:
    name: Build (.deb + .rpm + AppImage)
    runs-on: ubuntu-latest
    needs: [create-release, lint-python]
    outputs:
      artifact-dir: ${{ steps.build.outputs.artifact-dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env

      - name: Build Application
        id: build
        uses: ./.github/actions/build-app
        with:
          version: ${{ needs.create-release.outputs.version }}
          build-deb: "true"
          build-rpm: "true"
          build-arch: "false"
          build-appimage: "true"
          gdrive-client-id: ${{ secrets.GDRIVE_CLIENT_ID }}
          gdrive-client-secret: ${{ secrets.GDRIVE_CLIENT_SECRET }}

      - name: Upload Ubuntu-built packages
        uses: actions/upload-artifact@v4
        with:
          name: gdrive-linux-${{ needs.create-release.outputs.version }}
          path: ${{ steps.build.outputs.artifact-dir }}/
          retention-days: 90

  build-arch:
    name: Build (Arch Linux .pkg.tar.zst)
    runs-on: ubuntu-latest
    needs: [create-release, lint-python]
    container:
      image: archlinux:latest
      options: --user root
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git python python-pip python-virtualenv nodejs wget sudo binutils fuse2
          python -m venv /opt/venv
          PIP_CACHE_DIR=/tmp/pip-cache /opt/venv/bin/pip install -r requirements.txt
          echo "/opt/venv/bin" >> $GITHUB_PATH
          # Create non-root user for makepkg
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder /opt/venv

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build executable
        run: |
          chown -R builder:builder .
          export GDRIVE_CLIENT_ID="${{ secrets.GDRIVE_CLIENT_ID }}"
          export GDRIVE_CLIENT_SECRET="${{ secrets.GDRIVE_CLIENT_SECRET }}"
          # Bake credentials into source so PyInstaller bundles them
          sed -i "s/os.environ.get(\"GDRIVE_CLIENT_ID\", \"\")/os.environ.get(\"GDRIVE_CLIENT_ID\", \"${GDRIVE_CLIENT_ID}\")/" config.py
          sed -i "s/os.environ.get(\"GDRIVE_CLIENT_SECRET\", \"\")/os.environ.get(\"GDRIVE_CLIENT_SECRET\", \"${GDRIVE_CLIENT_SECRET}\")/" config.py
          sudo -u builder PATH="/opt/venv/bin:$PATH" /opt/venv/bin/pyinstaller --onefile --windowed --name gdrive-linux \
            --hidden-import googleapiclient \
            --hidden-import watchdog \
            --hidden-import PyQt6 \
            main.py

      - name: Package for Arch Linux
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          mkdir -p /tmp/packages
          chown -R builder:builder .
          sudo -u builder bash .github/scripts/package-arch.sh "${VERSION}" "dist/gdrive-linux" "/tmp/packages"

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: gdrive-linux-${{ needs.create-release.outputs.version }}-arch
          path: /tmp/packages/*.pkg.tar.zst
          retention-days: 90

  publish-release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: [create-release, build-ubuntu, build-arch]
    steps:
      - name: Create combined artifacts directory
        run: mkdir -p /tmp/release-assets

      - name: Download Ubuntu-built artifacts
        uses: actions/download-artifact@v4
        with:
          name: gdrive-linux-${{ needs.create-release.outputs.version }}
          path: /tmp/release-assets

      - name: Download Arch-built artifacts
        uses: actions/download-artifact@v4
        with:
          name: gdrive-linux-${{ needs.create-release.outputs.version }}-arch
          path: /tmp/release-assets

      - name: List all assets
        run: ls -lh /tmp/release-assets/

      - name: Upload assets to release
        shell: bash
        run: |
          for asset in /tmp/release-assets/*; do
            echo "Uploading: $(basename "${asset}")"
            gh release upload "${{ needs.create-release.outputs.tag }}" \
              "${asset}" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize release (remove draft status)
        shell: bash
        run: |
          gh release edit "${{ needs.create-release.outputs.tag }}" \
            --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [create-release, lint-python, build-ubuntu, build-arch, publish-release]
    if: always()
    steps:
      - name: Build summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.create-release.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** ${{ needs.publish-release.result == 'success' && '✅ Published' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Artifacts |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Create Release | ${{ needs.create-release.result }} | — |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint-python.result }} | — |" >> $GITHUB_STEP_SUMMARY
          echo "| Build (Ubuntu) | ${{ needs.build-ubuntu.result }} | .deb, .rpm, AppImage |" >> $GITHUB_STEP_SUMMARY
          echo "| Build (Arch) | ${{ needs.build-arch.result }} | .pkg.tar.zst |" >> $GITHUB_STEP_SUMMARY
          echo "| Publish | ${{ needs.publish-release.result }} | All assets attached |" >> $GITHUB_STEP_SUMMARY
