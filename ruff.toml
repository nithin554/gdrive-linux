# Ruff configuration for gdrive-linux.
# Line length is set to 120 to accommodate long f-strings and
# comment separator lines used throughout the codebase.

line-length = 120
target-version = "py311"

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PT",  # flake8-pytest-style
]

[lint.isort]
known-first-party = ["config", "auth", "autostart"]
